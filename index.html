<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090706">
  <title>For you<3 </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora"></div>
  <div class="grain"></div>
  <div id="petals"></div>

  <main class="scene">
    <section class="card" id="card">
      <div class="halo"></div>


      <div class="flower-stage" id="flowerStage" aria-label="Flores amarillas">
        <div class="flower flower-a"><span class="stem"></span><span class="bloom">✽</span></div>
        <div class="flower flower-b"><span class="stem"></span><span class="bloom">✽</span></div>
        <div class="flower flower-c"><span class="stem"></span><span class="bloom">✽</span></div>
        <div class="flower flower-d"><span class="stem"></span><span class="bloom">✽</span></div>
        <div class="flower flower-e"><span class="stem"></span><span class="bloom">✽</span></div>
      </div>

      <button id="bloomButton" type="button">
        <span>Haz florecer la pantalla</span>
        <b>✦</b>
      </button>
    </section>

    <div class="hint">toca la pantalla · mueve el dedo · mira las flores</div>
  </main>

  <canvas id="sparkles"></canvas>
  <script src="script.js"></script>
</body>
</html>
