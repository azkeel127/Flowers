<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090706">
  <title>Para Sha 🌼</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fondo dinámico: las flores y partículas se crean desde JavaScript -->
  <div class="aurora"></div>
  <div class="grain"></div>
  <div id="petals"></div>

  <main class="scene">
    <section class="card" id="card">
      <div class="halo"></div>

      <p class="eyebrow">PARA SHA · 20.09.26</p>

      <div class="flower-stage" id="flowerStage" aria-label="Flores amarillas">
        <!-- El ramo visual se genera con CSS/JS -->
        <div class="flower flower-a"><span class="stem"></span><span class="bloom">✽</span></div>
        <div class="flower flower-b"><span class="stem"></span><span class="bloom">✽</span></div>
        <div class="flower flower-c"><span class="stem"></span><span class="bloom">✽</span></div>
        <div class="flower flower-d"><span class="stem"></span><span class="bloom">✽</span></div>
        <div class="flower flower-e"><span class="stem"></span><span class="bloom">✽</span></div>
      </div>

      <div class="copy">
        <h1>Flores amarillas,<br><em>pero diferentes.</em></h1>
        <p class="message">
          No quería mandarte solamente unas flores.
          Quería hacerte un pequeño lugar en internet,
          con luz, movimiento y un montón de amarillo.
        </p>
      </div>

      <button id="bloomButton" type="button">
        <span>Haz florecer la pantalla</span>
        <b>✦</b>
      </button>

      <div class="signature">— hecho especialmente para Sha</div>
    </section>

    <div class="hint">toca la pantalla · mueve el dedo · mira las flores</div>
  </main>

  <canvas id="sparkles"></canvas>
  <script src="script.js"></script>
</body>
</html>
